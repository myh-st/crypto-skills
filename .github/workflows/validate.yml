name: Validate crypto skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate repository contracts
        run: python scripts/validate_repo.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: find frontend -name "*.js" -exec node --check {} \;

      - name: Run offline frontend tests
        run: node --test frontend/tests/*.test.mjs

      - name: Run deterministic evaluation fixture
        run: python -m crypto_eval demo --out-dir reports/crypto-eval-ci
